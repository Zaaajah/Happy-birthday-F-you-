<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ✨</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'Quicksand',sans-serif;
    background:linear-gradient(135deg,#ffe4f2,#e6e6ff,#e0fff4);
}

.container{
    max-width:800px;
    margin:auto;
    padding:20px;
    text-align:center;
}

.vn-box{
    background:white;
    padding:15px;
    border-radius:18px;
    display:flex;
    gap:10px;
    align-items:center;
}

.char{
    width:90px;
    border-radius:12px;
}

.text{
    text-align:left;
    font-size:14px;
    line-height:1.6;
}

.game-area{
    margin-top:20px;
    position:relative;
    height:300px;
    overflow:hidden;
    border-radius:15px;
    background:rgba(255,255,255,0.4);
}

.btn-love{
    padding:12px 18px;
    border:none;
    border-radius:20px;
    background:#ff6fae;
    color:white;
    font-weight:bold;
}

.btn-hate{
    padding:12px 18px;
    border:none;
    border-radius:20px;
    background:#333;
    color:white;
    font-weight:bold;

    position:absolute;
    left:50%;
    top:55%;
    transform:translate(-50%,-50%);
}

/* 🎯 RESULT SMOOTH */
#result{
    margin-top:10px;
    font-weight:bold;
    color:#ff3d7f;
    opacity:0;
    transform:translateY(10px);
    transition:all 0.35s ease;
}

#result.show{
    opacity:1;
    transform:translateY(0);
}

/* 🌸 SAKURA EXPLODE */
.sakura{
    position:fixed;
    pointer-events:none;
    z-index:9999;
    font-size:14px;
    animation: explode 900ms ease-out forwards;
}

@keyframes explode{
    0%{
        transform:translate(0,0) scale(1);
        opacity:1;
    }
    100%{
        transform:
            translate(calc(var(--x) * 1px), calc(var(--y) * 1px))
            scale(0.5);
        opacity:0;
    }
}

</style>
</head>

<body>

<div class="container">

<h1>Happy Birthday 🎀✨</h1>

<div class="vn-box">

    <img class="char" src="Nana.jpg">

    <div class="text" id="text1"></div>

    <img class="char" src="nana2.jpg">

</div>

<div class="vn-box" style="margin-top:10px; flex-direction:column; align-items:center;">

    <div style="font-weight:bold; margin-bottom:8px; text-align:center;">
        Tolong dibaca yaww
    </div>

    <div class="text" id="text2"></div>

</div>

<div class="game-area">

<h3>Ikoo Sayang Zaza Ga??</h3>

<button class="btn-love" id="loveBtn">Ikoo Sayang Zaza♥️</button>
<button class="btn-hate" id="hateBtn">Ikoo Ga Sayang Zaza💔</button>

<div id="result"></div>

</div>

</div>

<script>

/* ================= TEXT 1 ================= */
const text1 = document.getElementById("text1");

const words1 = `Haiyyee sayangg, Hari ini adalah hari yang istimewa dan spesial buat kamu, 5 Juni Itu hari yang bakalan aku inget² seumur hidup, karna apa? Karna dihari itulah kamu dilahirkan. Kalo kamu ga dilahirkan, mungkin kita ga bakalan ketemu😔. Zaza suka banget kalo ketemu sama Ikoo🥰, Zaza Sayang, Cinta, ah pokoknya suka hal-hal romantis bareng Ikoo!!, Ikoo jangan pernah sia-sia in Zaza yaw😉, yah... Intinya aku mw ngucapin Happy birthday, to my beloved one😘, semoga jadi anak yang baik-baik, bermanfaat buat semua orang, tambah Cantik, tambah pinter, biar bisa banggain kedua orang tua... Pokoknya Zaza Sayang sama Ikoo, Love u 🩷🩵💫 Muach😘`;

const arr1 = words1.split(" ");
let i1 = 0;

function type1(){
    if(i1 < arr1.length){
        text1.innerHTML += arr1[i1] + " ";
        i1++;
        setTimeout(type1, 110);
    }
}
type1();


/* ================= TEXT 2 ================= */
const text2 = document.getElementById("text2");

const words2 = `(Pesan Kedua) Semoga semua yang kamu impiin segera terwujud ya sayang!!😙, kamu disana jaga kesehatan loo, makan yang sehat, minum yang banyak, Jan terlalu banyak makan jajan.. oh ya, dengan hadirnya hari ini semoga bisa bikin kamu lebih baik lagi yaww😁(sama peka nya ditambah dong.. hehew😙), intinya tambah umur, tambah semangat juga!, Jan lupa belajar dan berlatih terus, maaf cuman bisa ngasih ini. Pokoknya Zaza Sayang banget sama Ikoo 🩷🩵💫 Love u Ikoo😘😘 -Zaa Ajah.`;

const arr2 = words2.split(" ");
let i2 = 0;

setTimeout(()=>{

    function type2(){
        if(i2 < arr2.length){
            text2.innerHTML += arr2[i2] + " ";
            i2++;
            setTimeout(type2, 110);
        }
    }

    type2();

}, 8500);


/* ================= LOVE ================= */
const loveBtn = document.getElementById("loveBtn");
const result = document.getElementById("result");

loveBtn.addEventListener("click", (e)=>{
    result.innerText = "Yaww, Sayangin Zaza terus ya Ikoo!!😘";
    result.classList.add("show");

    spawnSakura(e.clientX, e.clientY);
});


/* ================= HATE GAME ================= */
const hateBtn = document.getElementById("hateBtn");

let mode = 0;
let x = 0;
let y = 0;

hateBtn.addEventListener("click", (e)=>{
    if(mode === 0){
        mode = 1;
        hateBtn.innerText = "Eitsss no no yaa👌🏻";
    }

    spawnSakura(e.clientX, e.clientY);
});

setInterval(()=>{

    if(mode !== 1) return;

    const area = hateBtn.parentElement;
    const maxX = area.clientWidth - 120;
    const maxY = area.clientHeight - 60;

    x += (Math.random() * 160 - 80);
    y += (Math.random() * 160 - 80);

    if(x < -maxX/2) x = -maxX/2;
    if(x > maxX/2) x = maxX/2;
    if(y < -maxY/2) y = -maxY/2;
    if(y > maxY/2) y = maxY/2;

    hateBtn.style.transform = `translate(${x}px, ${y}px)`;

}, 400);


/* ================= SAKURA EXPLODE ================= */
function spawnSakura(x, y){

    const count = Math.floor(Math.random() * 3) + 7;

    for(let i = 0; i < count; i++){

        const el = document.createElement("div");
        el.className = "sakura";
        el.innerText = "🌸";

        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * 120 + 40;

        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance;

        el.style.setProperty("--x", dx);
        el.style.setProperty("--y", dy);

        el.style.left = x + "px";
        el.style.top = y + "px";

        document.body.appendChild(el);

        setTimeout(()=> el.remove(), 900);
    }
}

</script>

</body>
</html>
